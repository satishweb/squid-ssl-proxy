# Build and publish the image for a release tag.
#
# The tag has to have the form v<version>-r<revision> or <version>-r<revision>,
# for example 7.6-r0. The version is the version of the squid package that is
# installed in the image.
#
# The image is published to the Docker Hub and to the GitHub container
# registry. A release can only be cut from a commit that was built, tested
# and scanned.

name: Release

on:
  push:
    tags:
      - "v*"
      - "*-r*"
  workflow_dispatch:
    inputs:
      tag:
        description: "The release tag, for example 7.6-r0"
        required: true
        type: string
      dry_run:
        description: "Build the image without publishing it"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  actions: read
  packages: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  REGISTRY_DOCKERHUB: docker.io
  REGISTRY_GHCR: ghcr.io
  IMAGE_NAME: squid-ssl-proxy
  DOCKERHUB_OWNER: satishweb

jobs:
  gate:
    name: Check the build of the branch
    runs-on: ubuntu-latest
    steps:
      - name: The CI workflow has to have passed for this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          echo "Looking for a successful CI run for ${COMMIT}."
          conclusion=$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${COMMIT}&status=completed&per_page=20" \
            --jq '[.workflow_runs[].conclusion] | if index("success") then "success" else "none" end')
          if [ "${conclusion}" != "success" ]; then
            echo "::error::The CI workflow did not pass for ${COMMIT}. A release can only be cut from a commit that was built and tested on the branch."
            exit 1
          fi
          echo "The CI workflow passed for ${COMMIT}."

  verify:
    name: Verify the image
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve the release
        id: release
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG}"
          if [[ ! "${tag}" =~ ^v?([0-9]+\.[0-9]+-r[0-9]+)$ ]]; then
            echo "::error::The tag ${tag} does not have the expected form v<version>-r<revision>."
            exit 1
          fi
          echo "version=${BASH_REMATCH[1]}" >> "${GITHUB_OUTPUT}"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          build-args: |
            SQUID_VERSION=${{ steps.release.outputs.version }}
          load: true
          tags: squid-ssl-proxy:verify
          provenance: false

      - name: Scan the image for vulnerabilities and secrets
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: squid-ssl-proxy:verify
          format: table
          output: /tmp/trivy.txt
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: .trivyignore

      - name: Show the result of the scan
        if: always()
        run: cat /tmp/trivy.txt

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r tests/requirements.txt

      - name: Test the image
        run: |
          python ./tests/test-squid-proxy.py --image squid-ssl-proxy:verify

  publish:
    name: Publish
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve the release
        id: release
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG}"
          if [[ ! "${tag}" =~ ^v?([0-9]+\.[0-9]+-r[0-9]+)$ ]]; then
            echo "::error::The tag ${tag} does not have the expected form v<version>-r<revision>."
            exit 1
          fi
          version="${BASH_REMATCH[1]}"
          echo "The squid version is ${version}."
          {
            echo "version=${version}"
            echo "tags<<EOF"
            echo "${REGISTRY_DOCKERHUB}/${DOCKERHUB_OWNER}/${IMAGE_NAME}:${tag}"
            echo "${REGISTRY_DOCKERHUB}/${DOCKERHUB_OWNER}/${IMAGE_NAME}:${version}"
            echo "${REGISTRY_DOCKERHUB}/${DOCKERHUB_OWNER}/${IMAGE_NAME}:latest"
            echo "${REGISTRY_GHCR}/${GITHUB_REPOSITORY_OWNER}/${IMAGE_NAME}:${tag}"
            echo "${REGISTRY_GHCR}/${GITHUB_REPOSITORY_OWNER}/${IMAGE_NAME}:${version}"
            echo "${REGISTRY_GHCR}/${GITHUB_REPOSITORY_OWNER}/${IMAGE_NAME}:latest"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Docker Hub
        if: ${{ !inputs.dry_run }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to the GitHub container registry
        if: ${{ !inputs.dry_run }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY_GHCR }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          build-args: |
            SQUID_VERSION=${{ steps.release.outputs.version }}
          push: ${{ !inputs.dry_run }}
          tags: ${{ steps.release.outputs.tags }}
          provenance: false
          labels: |
            org.opencontainers.image.title=Squid SSL Proxy
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.release.outputs.version }}

  release:
    name: GitHub release
    needs: publish
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') && !inputs.dry_run
    permissions:
      contents: write
    steps:
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "The release ${TAG} exists already, its notes are updated."
            gh release edit "${TAG}" --title "${TAG}" --generate-notes
          else
            gh release create "${TAG}" --title "${TAG}" --generate-notes
          fi
