# Build and publish the image for a release tag.
#
# The tag has to have the form v<version>.
#
# The image is published to the Docker Hub and to the GitHub container
# registry. A release can only be cut from a commit that was built, tested
# and scanned.

name: Release

on:
  push:
    tags:
      - "v*"
      - "*-r*"
  workflow_dispatch:
    inputs:
      tag:
        description: "The release tag"
        required: true
        type: string
      dry_run:
        description: "Build the image without publishing it"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  actions: read
  packages: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  REGISTRY_DOCKERHUB: docker.io
  REGISTRY_GHCR: ghcr.io
  IMAGE_NAME: squid-ssl-proxy
  DOCKERHUB_OWNER: satishweb

jobs:

  gate:
    name: Check the build of the branch
    runs-on: ubuntu-latest
    steps:
      - name: The CI workflow has to have passed for this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          echo "Looking for a successful CI run for ${COMMIT}."
          conclusion=$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${COMMIT}&status=completed&per_page=20" \
            --jq '[.workflow_runs[].conclusion] | if index("success") then "success" else "none" end')
          if [ "${conclusion}" != "success" ]; then
            echo "::error::The CI workflow did not pass for ${COMMIT}. A release can only be cut from a commit that was built and tested on the branch."
            exit 1
          fi
          echo "The CI workflow passed for ${COMMIT}."

  verify:
    name: Verify the image
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          load: true
          tags: squid-ssl-proxy:verify
          provenance: false

      - name: Scan the image for vulnerabilities and secrets
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: squid-ssl-proxy:verify
          format: table
          output: /tmp/trivy.txt
          scanners: vuln,secret
          vuln-type: os
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: .trivyignore

      - name: Show the result of the scan
        if: always()
        run: cat /tmp/trivy.txt

      - name: Report the findings of the programs in the image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: squid-ssl-proxy:verify
          format: table
          output: /tmp/trivy-all.txt
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"
          trivyignores: .trivyignore

      - name: Show the findings of the programs in the image
        if: always()
        run: cat /tmp/trivy-all.txt

      - name: Generate the bill of materials
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: squid-ssl-proxy:verify
          format: cyclonedx
          output: /tmp/sbom.cdx.json

      - name: Upload the bill of materials
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: /tmp/sbom.cdx.json
          if-no-files-found: error

  publish:
    name: Publish
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build and publish
        run: |
          set -euo pipefail
          tag="${{ github.ref_name }}"
          version="${tag#v}"
          first_tag="${REGISTRY_DOCKERHUB}/${DOCKERHUB_OWNER}/${IMAGE_NAME}:${tag}"
          docker build -f Dockerfile -t "$first_tag" .
          for tag_var in \
            "${REGISTRY_DOCKERHUB}/${DOCKERHUB_OWNER}/${IMAGE_NAME}:${version}" \
            "${REGISTRY_DOCKERHUB}/${DOCKERHUB_OWNER}/${IMAGE_NAME}:latest" \
            "${REGISTRY_GHCR}/${GITHUB_REPOSITORY_OWNER}/${IMAGE_NAME}:${tag}" \
            "${REGISTRY_GHCR}/${GITHUB_REPOSITORY_OWNER}/${IMAGE_NAME}:${version}" \
            "${REGISTRY_GHCR}/${GITHUB_REPOSITORY_OWNER}/${IMAGE_NAME}:latest" ; do
            [ "$tag_var" = "$first_tag" ] || docker tag "$first_tag" "$tag_var"
            docker push "$tag_var"
          done

      - name: Log in to the Docker Hub
        if: ${{ !inputs.dry_run }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to the GitHub container registry
        if: ${{ !inputs.dry_run }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY_GHCR }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

  release:
    name: GitHub release
    needs: publish
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.ref, 'refs/tags/') && !inputs.dry_run }}
    permissions:
      contents: write
    steps:
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG}"
          if [[ ! "${tag}" =~ ^v?([0-9]+\.[0-9]+-r[0-9]+)$ ]] ; then
            echo "::error::The tag ${tag} does not have the expected form."
            exit 1
          fi
          version="${BASH_REMATCH[1]}"
          echo "Release ${TAG} with version ${version}"

